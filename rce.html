<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    body { 
        font-family: Arial, sans-serif; 
        padding: 20px; 
    }
    .task { 
        margin: 30px 0; 
        padding: 15px; 
        border: 1px solid #ccc; 
    }
    button { 
        padding: 8px 16px; 
        margin: 5px; 
        cursor: pointer; 
    }
    .card { 
        border: 2px solid #333; 
        padding: 20px; 
        max-width: 300px; 
    }
  </style>
</head>
<body>
    <div id = "root"></div>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <script>
        //1.2 Tạo button đơn 
        const button = React.createElement(
            "button", 
            {
                onClick:() => alert("Bạn đã nhấn button!"),
                style:{
                    backgroundColor: '#007bff',
                    color: 'white', 
                    border: 'none', 
                    borderRadius: '4px'
                    } 
            } , 
            "Nhấn tôi")

        //1.3 tạo card lồng nhau 
            const card = React.createElement("div", 
                { 
                    className : "card"
                },
                React.createElement("h2", null , "Thông tin"),
                React.createElement("p" , null , "Đây là một card đơn giản"),
            )

        //1.4 tạo danh sách sản phẩm 
            const listproduct = React.createElement("div" , null ,
                React.createElement("h1" , null ,"Danh sách sản phẩm"),
                React.createElement("ul", null , 
                    React.createElement("li" , null , "Sản phẩm 1 - 100.000đ"),
                    React.createElement("li" , null , "Sản phẩm 2 - 200.000đ"),
                    React.createElement("li" , null , "Sản phẩm 3 - 300.000đ"),

                 )
             );
        
        //1.1 tạo wrapper và render vào root
        const wrapper = React.createElement(
            React.Fragment, 
            null,
            button,
            card,
            listproduct
        )

        const root = ReactDOM.createRoot(document.querySelector("#root"))
        root.render(wrapper);
    </script>
</body>
</html>
